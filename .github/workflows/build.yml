name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Look up versions
        if: always()
        run: |
          {
            echo "== loader"; curl -s https://meta.fabricmc.net/v2/versions/loader | head -c 400; echo
            echo "== game"; curl -s https://meta.fabricmc.net/v2/versions/game | head -c 600; echo
            echo "== fabric-api"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26.3[^<]*</version>' | tail -5
            echo "== hm-api"; curl -s https://maven.azureaaron.net/releases/net/azureaaron/hm-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
            echo "== modmenu"; curl -s "https://api.modrinth.com/v2/project/modmenu/version?game_versions=%5B%2226.3%22%5D" | grep -o '"version_number":"[^"]*"' | head -5
            echo "== loom"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5
          } > versions.txt 2>&1
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}
      # Dumps signatures of the Minecraft classes listed in .github/javap.txt (for checking mixin targets)
      - name: Dump class signatures
        if: always() && hashFiles('.github/javap.txt') != ''
        run: |
          find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft|fabric-rendering|fabric-api' | grep -v sources | awk '{print (index($0,"fabric-loom/26.3")?0:1) " " $0}' | sort -n | cut -d' ' -f2- > /tmp/mcjars.txt || true
          cat /tmp/mcjars.txt > javap-out.txt
          while read -r cls; do
            [ -z "$cls" ] && continue
            for jar in $(cat /tmp/mcjars.txt); do
              if unzip -l "$jar" "${cls//.//}.class" >/dev/null 2>&1; then
                echo "=== $cls ($jar)" >> javap-out.txt
                javap -p -cp "$jar" "$cls" >> javap-out.txt 2>&1
                break
              fi
            done
          done < .github/javap.txt
          echo "=== CLASS SEARCH" >> javap-out.txt
          for jar in $(head -1 /tmp/mcjars.txt); do unzip -l "$jar" 2>/dev/null | grep -E 'com/mojang/(renderpearl|blaze3d)/|Uniform|Std140|net/minecraft/client/gui/render/' | grep -v '\$' | awk '{print $4}' ; done | sort -u >> javap-out.txt
          find ~/.gradle/caches -name '*.jar' | grep -iE 'lwjgl' | head -20 >> javap-out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fancybars
          path: build/libs/*.jar
      # Publishes the jar (or the failure log) to the "jar" branch so it can be downloaded easily
      - name: Publish to jar branch
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/out
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          cp build-log.txt /tmp/out/ 2>/dev/null || true
          cp javap-out.txt /tmp/out/ 2>/dev/null || true
          cp versions.txt /tmp/out/ 2>/dev/null || true
          BRANCH="${GITHUB_REF_NAME}"
          TARGET=jar; [ "$BRANCH" != "main" ] && TARGET="jar-${BRANCH}"
          cd /tmp/out
          git init -q -b "$TARGET"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"
